<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Spreadsheet-like dense table</title>
  <style>
    body { margin:0; padding:24px; font-family:Segoe UI, sans-serif; background:#f3f3f3; }
    .win { background:#fff; border:1px solid #bbb; max-width:900px; margin:0 auto; }
    .tb { height:28px; background:#ddd; font-size:12px; padding:6px 10px; color:#444; }
    table { border-collapse:collapse; width:100%; font-size:13px; }
    th { background:#e8eef7; border:1px solid #9ab; padding:6px 8px; text-align:left; }
    td { border:1px solid #ccc; padding:6px 8px; }
    tr:nth-child(even) td { background:#fafafa; }
    .num { text-align:right; font-variant-numeric:tabular-nums; }
  </style>
</head>
<body>
  <div class="win">
    <div class="tb" aria-hidden="true">Book1.xlsx — Sheet1</div>
    <table>
      <thead>
        <tr>
          <th data-block-id="t_h0">SKU</th>
          <th data-block-id="t_h1">Product</th>
          <th data-block-id="t_h2">Qty</th>
          <th data-block-id="t_h3">Price</th>
          <th data-block-id="t_h4">Region</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td data-block-id="t_r1c0">A-100</td>
          <td data-block-id="t_r1c1">USB-C Hub 7-in-1</td>
          <td class="num" data-block-id="t_r1c2">128</td>
          <td class="num" data-block-id="t_r1c3">39.90</td>
          <td data-block-id="t_r1c4">APAC</td>
        </tr>
        <tr>
          <td data-block-id="t_r2c0">B-220</td>
          <td data-block-id="t_r2c1">Mechanical Keyboard</td>
          <td class="num" data-block-id="t_r2c2">54</td>
          <td class="num" data-block-id="t_r2c3">89.00</td>
          <td data-block-id="t_r2c4">EU</td>
        </tr>
        <tr>
          <td data-block-id="t_r3c0">C-015</td>
          <td data-block-id="t_r3c1">4K Webcam</td>
          <td class="num" data-block-id="t_r3c2">33</td>
          <td class="num" data-block-id="t_r3c3">119.00</td>
          <td data-block-id="t_r3c4">NA</td>
        </tr>
        <tr>
          <td data-block-id="t_r4c0">D-908</td>
          <td data-block-id="t_r4c1">Noise-Cancel Headset</td>
          <td class="num" data-block-id="t_r4c2">77</td>
          <td class="num" data-block-id="t_r4c3">149.50</td>
          <td data-block-id="t_r4c4">APAC</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
