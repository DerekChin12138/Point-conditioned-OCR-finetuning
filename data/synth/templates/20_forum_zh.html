<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>论坛帖子</title>
  <style>
    body { margin:0; background:#eef0f4; font-family:"Noto Sans SC",sans-serif; color:#1a1a1a; }
    .wrap { max-width:780px; margin:20px auto; }
    .post { background:#fff; border:1px solid #d9dde5; margin-bottom:12px; padding:16px 18px; }
    .meta { font-size:12px; color:#888; margin-bottom:8px; }
    h1 { font-size:18px; margin:0 0 10px; }
    p { font-size:14px; line-height:1.7; margin:0 0 8px; }
    .reply { background:#fafbfc; }
  </style>
</head>
<body>
  <div class="wrap">
    <article class="post">
      <div class="meta" data-block-id="bbs_meta1">楼主 · 机器学习 · 今天 14:02</div>
      <h1 data-block-id="bbs_h1">请教：点条件 OCR 负例要采样多少？</h1>
      <p data-block-id="bbs_p1">我在 AutoDL 4090 上做 Stage A。正例每块 3 个点，负例目前每页 2 个，empty-on-chrome 还是一般。</p>
      <p data-block-id="bbs_p2">有没有建议的正负比？栏缝和标题栏要不要加权？</p>
    </article>
    <article class="post reply">
      <div class="meta" data-block-id="bbs_meta2">2 楼 · 今天 14:40</div>
      <p data-block-id="bbs_r1">建议负例提到每页 4–8 个，并显式覆盖窗口 chrome、图标区。</p>
      <p data-block-id="bbs_r2">若仍整页倾倒，先查标签是否误用了全文 Markdown。</p>
    </article>
  </div>
</body>
</html>
