### Stage A: POINT-only QLoRA SFT on ATH-MaaS/OvisOCR2
### Target: single ~24GB NVIDIA GPU (Windows or Linux). Do NOT use Apple MLX.
###
### Prereqs:
###   1. Clone LLaMA-Factory and install its deps (CUDA torch).
###   2. Build data → data/llamafactory/ovisocr2_point_{train,val}.json
###   3. Point dataset_dir at this repo's data/llamafactory (or merge dataset_info.json).
###
### Early-stop manually if eval over_extraction_rate stops improving.

### model
model_name_or_path: ATH-MaaS/OvisOCR2
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
# Prefer freezing vision on Stage A (language adapts to POINT)
freeze_vision_tower: true
freeze_multi_modal_projector: false

### dataset
dataset_dir: ../data/llamafactory
dataset: ovisocr2_point_train
eval_dataset: ovisocr2_point_val
template: qwen3_vl
cutoff_len: 8192
overwrite_cache: true
preprocessing_num_workers: 4

### output
output_dir: ../checkpoints/stage_a_point_qlora
logging_steps: 10
save_steps: 200
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
ddp_timeout: 180000000
optim: adamw_torch
max_grad_norm: 1.0

### eval
val_size: 0.0
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 200
# Prefer checkpoint with lowest over-extraction on held-out (run eval/ separately)

### compute
gradient_checkpointing: true
# QLoRA: enable if LLaMA-Factory build supports quantization for this VL model
# quantization_bit: 4
# quantization_type: nf4
# double_quantization: true
